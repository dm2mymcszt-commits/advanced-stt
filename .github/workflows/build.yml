name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-stt-jar
          path: build/libs/*.jar
          if-no-files-found: error

  in-game-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual screen
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Play the mod in a real game (fake microphone and speech service)
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-game-screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
