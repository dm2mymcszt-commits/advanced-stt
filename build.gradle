plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu is optional: only its API is compiled against, it is never bundled.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Fake Cartesia / AssemblyAI servers for the protocol tests.
	testImplementation 'org.java-websocket:Java-WebSocket:1.6.0'
}

fabricApi {
	// In-game tests in src/gametest: ./gradlew runClientGameTest (headless: xvfb-run -a ./gradlew runClientGameTest).
	configureTests {
		createSourceSet = true
		modId = 'advanced_stt_gametest'
		enableGameTests = false
		enableClientGameTests = true
	}
}

loom {
	runs {
		clientGameTest {
			// Test keys go in a throwaway folder, never the developer's real one.
			property 'advanced_stt.testPrivateFolder', file('build/run/clientGameTest/advanced-stt-private').absolutePath
		}
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_${projectName}" }
	}
}
